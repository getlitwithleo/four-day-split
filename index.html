<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E6E9E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1112" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="4-Day Split">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- four-day-split-app -->
<title>Four-Day Split</title>
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<script>window.__STANDALONE__ = true;</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<style>
/* Layout: one thumb-width column. Bumper-plate day picker, the knee check, then the day's named blocks in order, with a timer dock pinned to the bottom edge. */
:root {
  --bg: #E6E9E8;
  --surface: #F9FAFA;
  --sunk: #DADFDE;
  --ink: #111416;
  --muted: #545C61;
  --line: #C3CACA;
  --steel: #A7AFB2;
  --red: #C7362B;
  --blue: #2452C9;
  --yellow: #E0A30E;
  --yellow-deep: #8A6100;
  --green: #1E7D45;
  --on-red: #FFFFFF;
  --on-blue: #FFFFFF;
  --on-yellow: #16130B;
  --on-green: #FFFFFF;
  --good: #1E7D45;
  --warn: #B4500C;
  --acc: var(--red);
  --acc-ink: var(--on-red);
  --acc-text: var(--red);
  --f-display: "Big Shoulders Display", "Big Shoulders", "Oswald", "Arial Narrow", sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-card: 18px;
  --r-ctl: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1112; --surface: #191C1E; --sunk: #23272A; --ink: #EBEEEE; --muted: #9AA2A6; --line: #30363A; --steel: #5D656A;
    --red: #F05242; --blue: #6690FF; --yellow: #F3C335; --yellow-deep: #F3C335; --green: #3DB86E;
    --on-red: #140B0A; --on-blue: #0A0F1C; --on-yellow: #16130B; --on-green: #0A140E;
    --good: #4CC47C; --warn: #F2913F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1112; --surface: #191C1E; --sunk: #23272A; --ink: #EBEEEE; --muted: #9AA2A6; --line: #30363A; --steel: #5D656A;
  --red: #F05242; --blue: #6690FF; --yellow: #F3C335; --yellow-deep: #F3C335; --green: #3DB86E;
  --on-red: #140B0A; --on-blue: #0A0F1C; --on-yellow: #16130B; --on-green: #0A140E;
  --good: #4CC47C; --warn: #F2913F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
button:not(:disabled) { cursor: pointer; }
:focus-visible { outline: 3px solid var(--acc-text); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app[data-day="lowerA"] { --acc: var(--red); --acc-ink: var(--on-red); --acc-text: var(--red); }
.app[data-day="upperA"] { --acc: var(--blue); --acc-ink: var(--on-blue); --acc-text: var(--blue); }
.app[data-day="lowerB"] { --acc: var(--yellow); --acc-ink: var(--on-yellow); --acc-text: var(--yellow-deep); }
.app[data-day="upperB"] { --acc: var(--green); --acc-ink: var(--on-green); --acc-text: var(--green); }
.app {
  --acc-soft: color-mix(in srgb, var(--acc) 16%, var(--surface));
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 10px calc(120px + env(safe-area-inset-bottom, 0px));
}

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 6px; }
.brand { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 19px; line-height: .95; letter-spacing: .05em; text-transform: uppercase; }
.brand span { display: block; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sunk); }
.tab {
  appearance: none; border: 0; background: transparent; color: var(--muted);
  font-weight: 600; font-size: 14px; line-height: 1; padding: 0 12px; min-height: 38px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.tab .i { width: 20px; height: 20px; }
.tab-icon { padding: 0 10px; }

/* Plate picker */
.plates { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-block: 12px 4px; }
.plate-btn {
  appearance: none; border: 0; background: none; position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 14px;
}
.plate {
  --d: min(66px, 16.5vw);
  display: block; position: relative; width: var(--d); height: var(--d); margin-bottom: 6px; border-radius: 50%;
  background: var(--plate);
  box-shadow:
    inset 0 0 0 3px color-mix(in srgb, var(--plate) 70%, #000),
    inset 0 0 0 calc(var(--d) * .17) var(--plate),
    inset 0 0 0 calc(var(--d) * .17 + 1.5px) color-mix(in srgb, var(--plate) 68%, #000);
  opacity: .45; transform: scale(.82);
  transition: transform .28s cubic-bezier(.3, 1.5, .5, 1), opacity .2s;
}
.hub { position: absolute; inset: 35%; border-radius: 50%; background: var(--steel); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--steel) 55%, #000); }
.hub::after { content: ""; position: absolute; inset: 27%; border-radius: 50%; background: var(--bg); }
.plate-btn[aria-pressed="true"] .plate { opacity: 1; transform: scale(1); outline: 2px solid var(--ink); outline-offset: 3px; }
.plate-day { font-size: 11px; font-weight: 700; line-height: 1.1; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.plate-name { font-family: var(--f-display); font-size: 18px; font-weight: 800; line-height: 1; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.plate-btn[aria-pressed="true"] .plate-name { color: var(--ink); }
.tag {
  position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-weight: 700; line-height: 1; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
  padding: 4px 6px; border-radius: 999px; background: var(--ink); color: var(--bg);
}

/* Day hero */
.hero { padding-block: 12px 18px; margin-bottom: 14px; border-bottom: 2px solid var(--ink); }
.eyebrow { margin: 0; font-size: 12px; font-weight: 700; line-height: 1.2; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.day-title {
  margin: 6px 0 8px; font-family: var(--f-display); font-weight: 900; font-size: clamp(64px, 21vw, 108px);
  line-height: .84; letter-spacing: .005em; text-transform: uppercase; text-wrap: balance;
}
.day-title .acc { color: var(--acc-text); }
.gear { margin: 0; font-size: 16px; font-weight: 700; }
.meta { margin: 2px 0 12px; font-size: 15px; color: var(--muted); }
.prog { display: flex; align-items: center; gap: 12px; }
.prog-bar { flex: 1; height: 10px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.prog-bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--acc); transition: width .3s ease; }
.prog-label { font-family: var(--f-num); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Knee check */
.knee { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; margin-bottom: 12px; }
.knee-h { margin: 0; font-size: 16px; font-weight: 700; }
.knee-sub { margin: 2px 0 12px; font-size: 14px; color: var(--muted); }
.pain-scale { display: flex; flex-direction: column; gap: 6px; }
.pain-row { display: flex; gap: 6px; }
.pain {
  appearance: none; flex: 1; min-width: 0; height: 48px; border-radius: var(--r-ctl);
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
  font-family: var(--f-num); font-size: 19px; font-weight: 700;
}
.pain.over { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); color: var(--warn); }
.pain[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.pain-key { display: flex; justify-content: space-between; gap: 8px; margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.pain-key span:last-child { color: var(--warn); }
.knee-done { display: flex; align-items: center; gap: 14px; }
.knee-score { flex: none; display: flex; align-items: baseline; }
.knee-score b { font-family: var(--f-num); font-size: 38px; line-height: 1; }
.knee-score small { font-family: var(--f-num); font-size: 15px; color: var(--muted); }
.knee-score.over b { color: var(--warn); }
.knee-text { flex: 1; min-width: 0; }
.verdict { margin: 2px 0 0; font-size: 14px; line-height: 1.35; }
.verdict.good { color: var(--good); }
.verdict.warn { color: var(--warn); }
.rules summary { cursor: pointer; padding-top: 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
.rules ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }

/* Blocks */
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.block {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
  padding: 14px 14px 6px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 10px);
}
.block.collapsed { padding-bottom: 14px; }
.block-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.start-pill {
  display: inline-block; margin-bottom: 6px; padding: 5px 8px; border-radius: 8px; background: var(--acc); color: var(--acc-ink);
  font-size: 11px; font-weight: 700; line-height: 1; letter-spacing: .1em; text-transform: uppercase;
}
.blk-title { margin: 0; font-family: var(--f-display); font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
.blk-meta { margin: 3px 0 0; font-family: var(--f-num); font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--muted); }
.blk-note { margin: 10px 0 0; font-size: 14px; font-weight: 600; }
.done-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px 5px 6px; border-radius: 999px;
  background: var(--acc); color: var(--acc-ink); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}
.done-badge .i { width: 16px; height: 16px; }
.block:not(.collapsed) .summary { display: none; }
.block.collapsed .block-body { display: none; }
.summary {
  appearance: none; width: 100%; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 12px; border: 0; border-radius: var(--r-ctl); background: var(--acc-soft); color: var(--ink); text-align: left;
}
.sum-lines { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-family: var(--f-num); font-size: 14px; line-height: 1.35; font-variant-numeric: tabular-nums; }
.sum-line b { font-family: var(--f-body); font-size: 14px; font-weight: 700; color: var(--acc-text); margin-right: 6px; }
.sum-edit { flex: none; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--acc-text); }

.specs { display: flex; flex-direction: column; margin-top: 10px; }
.spec { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; padding-block: 10px; border-top: 1px solid var(--line); }
.spec-main { min-width: 0; }
.spec-name { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.25; }
.spec-rx { margin: 2px 0 0; font-family: var(--f-num); font-size: 16px; font-weight: 700; line-height: 1.3; }
.spec-cue { margin: 3px 0 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.spec-link { display: inline-block; padding-block: 6px 2px; font-size: 14px; font-weight: 700; line-height: 1.3; color: var(--acc-text); text-underline-offset: 3px; }
.spec-last { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.spec-last span { display: block; font-family: var(--f-num); font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.swap {
  appearance: none; margin-top: 8px; min-height: 40px; padding: 8px 12px; border-radius: 999px;
  border: 1.5px dashed var(--warn); background: transparent; color: var(--ink); font-size: 14px; font-weight: 700; text-align: left;
}
.play {
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 48px;
  color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
}
.i-play { width: 42px; height: 42px; }
.i-play circle { fill: var(--acc); }
.i-play path { fill: var(--acc-ink); }

.sets { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.setgrid { display: grid; grid-template-columns: var(--lab, 1.6rem) minmax(0, 1fr) minmax(0, 1fr) 3.4rem; gap: 6px; align-items: center; }
.setgrid.hold { grid-template-columns: var(--lab, 1.6rem) minmax(0, 1fr) minmax(0, 1fr) 3rem 3.4rem; }
.sets.multi { --lab: 5.6rem; }
.sets-head span { font-size: 11px; font-weight: 700; line-height: 1; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.sets-head span:first-child { text-align: left; }
.set-n { font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1; color: var(--muted); }
.lab {
  min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.15; color: var(--ink);
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere;
}
.in {
  width: 100%; min-width: 0; height: 52px; padding: 0 4px;
  border: 1.5px solid var(--line); border-radius: var(--r-ctl); background: var(--bg); color: var(--ink);
  font-family: var(--f-num); font-size: 21px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums;
  -webkit-appearance: none; appearance: none;
}
.in::placeholder { color: var(--muted); opacity: .5; font-weight: 500; }
.in:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 30%, transparent); }
.set-row.ramp:not(.done) .in { border-style: dashed; }
.check, .hold-btn {
  height: 52px; display: grid; place-items: center; padding: 0;
  border-radius: var(--r-ctl); border: 1.5px solid var(--line); background: var(--surface); color: var(--muted);
}
.check .i { width: 26px; height: 26px; }
.hold-btn { border-color: var(--acc); color: var(--acc-text); background: transparent; }
.hold-btn .i { width: 24px; height: 24px; }
.set-row.done .check { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.set-row.done .in { background: var(--acc-soft); border-color: transparent; }
.set-row.done .set-n, .set-row.done .lab { color: var(--acc-text); }
.set-row.timing .hold-btn { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.set-row.timing .in-r { border-color: var(--acc); }

.round { display: flex; flex-direction: column; gap: 6px; }
.round + .round { padding-top: 8px; border-top: 1px dashed var(--line); }
.round-head { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; line-height: 1.2; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.round-head .i { width: 15px; height: 15px; color: var(--acc-text); }
.round-rows { display: flex; flex-direction: column; gap: 6px; }
.round.collapsed .round-rows { display: none; }
.round:not(.collapsed) .round-sum { display: none; }
.round-sum {
  appearance: none; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 12px; border: 0; border-radius: var(--r-ctl); background: var(--acc-soft); color: var(--ink);
  font-family: var(--f-num); font-size: 14px; line-height: 1.35; text-align: left; font-variant-numeric: tabular-nums;
}
.set-tools { display: flex; flex-wrap: wrap; gap: 0 16px; }
.tool { appearance: none; border: 0; background: none; padding: 6px 0; min-height: 42px; font-size: 14px; font-weight: 700; color: var(--muted); }
.tool:hover { color: var(--ink); }

/* Finish */
.finish { margin-top: 24px; display: flex; flex-direction: column; align-items: stretch; gap: 8px; text-align: center; }
.finish-btn {
  appearance: none; height: 60px; border: 0; border-radius: 16px; background: var(--ink); color: var(--bg);
  font-family: var(--f-display); font-size: 24px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
}
.finish-btn:disabled { opacity: .3; }
.finish-btn.confirm { background: var(--acc); color: var(--acc-ink); }
.finish-hint { margin: 0; font-size: 14px; color: var(--muted); }
.link-btn { appearance: none; align-self: center; border: 0; background: none; padding: 10px 6px; font-size: 14px; font-weight: 700; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.link-btn.danger { color: var(--red); }

/* Timer dock */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  transition: background-color .2s;
}
.dock.running { background: var(--ink); color: var(--bg); border-top-color: var(--ink); }
.dock.alert { background: var(--acc); color: var(--acc-ink); border-top-color: var(--acc); }
.dock-fill { position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: var(--acc); transform-origin: left; }
.dock-inner { position: relative; max-width: 528px; margin: 0 auto; min-height: 58px; display: flex; align-items: center; gap: 10px; }
.dock-stat { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.dock-label { font-size: 11px; font-weight: 700; line-height: 1.25; letter-spacing: .12em; text-transform: uppercase; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-time { font-family: var(--f-num); font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.dock-next { font-family: var(--f-display); font-size: 25px; font-weight: 800; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-ctls { display: flex; gap: 6px; flex: none; }
.dock-btn {
  appearance: none; flex: none; height: 52px; padding: 0 18px 0 14px; border: 0; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--acc); color: var(--acc-ink);
  font-family: var(--f-display); font-size: 21px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
}
.dock-btn .i { width: 22px; height: 22px; }
.dock-ctl {
  appearance: none; height: 48px; min-width: 54px; padding: 0 12px; border-radius: 999px;
  border: 1.5px solid currentColor; background: transparent; color: inherit;
  font-family: var(--f-num); font-size: 16px; font-weight: 700;
}
.dock.running .dock-ctl { border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.dock-ctl.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.dock.alert .dock-ctl.primary { background: var(--acc-ink); border-color: var(--acc-ink); color: var(--acc); }
.dock.alert .dock-inner { animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { transform: scale(1.02); } }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  width: min(528px, calc(100% - 32px)); transform: translateX(-50%);
  padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--bg);
  font-size: 15px; font-weight: 600; line-height: 1.35; box-shadow: 0 8px 24px rgb(0 0 0 / .25);
}
.toast.show { animation: toast-in .25s ease-out; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

/* History + settings */

  const prevKey = Object.keys(S.knee.checks).filter((k) => k < today && S.knee.checks[k] && typeof S.knee.checks[k].p === 'number').sort().pop();
  const prev = prevKey ? S.knee.checks[prevKey] : null;

  if (!c || ui.kneeEdit) {

    el.innerHTML = `<p class="knee-h">Morning knee check</p>

/* Grey placeholder: the plan's target reps or seconds, else your previous set today, else the same set last time. */

  const last = lastFor(exId);
  if (last) {
    const lr = last.rows.filter((r) => (r.k || '') === kind);
    if (lr.length) {
      const idx = rows.slice(0, i).filter((r) => (r.k || '') === kind).length;

}

  let hint = dn === 0 ? 'Tick off a set to start logging this workout.' : left ? `${left} set${left === 1 ? '' : 's'} still open.` : 'Every set is done.';

}

}

}

/* ---------- Logging sets ---------- */
function scrollToNextBlock(bid) {
  const blocks = DAY[cur.day].blocks, idx = blocks.findIndex((b) => b.id === bid);
  const next = blocks.slice(idx + 1).concat(blocks.slice(0, idx)).find((b) => !blockComplete(b));
  const el = next ? document.getElementById('block-' + next.id) : $('#finish');
  if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: next ? 'start' : 'center' });
}

  const b = cur.map[exId].b, multi = b.items.length > 1;
  const g = groupOf(b, cur.s, exId, i);

  const bDone = blockComplete(b);

  if (multi && gDone) { ui.grace.add(rk); ui.expanded.delete(rk); }

  rerenderBlock(b.id); updateProgress(); buzz(30);

  if (dn >= tot) { if (!busy) T = { mode: 'idle' }; renderDock(); toast('Every set is done. Tap Finish workout to log it.'); }

function toggleSet(exId, i) {

  const rv = r.r != null ? r.r : ph(exId, rows, i, 'r', m.it);

    return;
  }

function changeSets(b, g, add) {

  if (add) ents.forEach((e) => e.rows.push(blankRow(false)));
  else {
    const max = Math.max(...ents.map((e) => work(e.rows)));
    if (max <= 1) return;
    ents.forEach((e) => {
      if (work(e.rows) !== max) return;

  if (to === baseId) delete s.swaps[baseId]; else s.swaps[baseId] = to;
  if (!s.log[to]) s.log[to] = defaultRows(it, to);
  if (s.log[from] && !s.log[from].some((r) => r.done)) delete s.log[from];

}

/* ---------- Timers ---------- */
const PREP_MS = 5000;
let tickTimer = null;
function ensureTick() { if (!tickTimer) tickTimer = setInterval(tick, 200); }
function stopTick() { clearInterval(tickTimer); tickTimer = null; }

let ac = null;
function unlockAudio() {
  try {
    if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
    if (ac && ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function beep(n = 1, freq = 880) {
  if (!S.prefs.sound || !ac) return;
  try {
    const t0 = ac.currentTime + 0.02;
    for (let k = 0; k < n; k++) {
      const o = ac.createOscillator(), g = ac.createGain(), t = t0 + k * 0.24;

function startRest(sec, b) {

  renderDock(); ensureTick();

/* ---------- Progress ---------- */
const charts = {};

  if (min === max) { const pad = Math.max(1, Math.abs(max) * 0.1); min -= pad; max += pad; }
  const raw = (max - min) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw))), err = raw / mag;
  const step = (err > 5 ? 10 : err > 2 ? 5 : err > 1 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 100) / 100);
  return { lo, hi, ticks };
}
/* One line chart: time on x, one value per point, tap or hover for the exact set. */
function chartHTML(id, pts, o) {
  const W = 320, H = 168, L = 36, R = 16, T = 20, B = 26;

  const x = (t) => (span ? L + ((t - t0) / span) * (W - L - R) : L + (W - L - R) / 2);
  const y = (v) => T + ((hi - v) / (hi - lo || 1)) * (H - T - B);
  const xs = pts.map((p) => x(p.t)), ys = pts.map((p) => y(p.v)), n = pts.length - 1;
  const grid = ticks.map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="tick" x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmtNum(v)}</text>`).join('');
  const ref = o.ref ? `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(o.ref.v).toFixed(1)}" y2="${y(o.ref.v).toFixed(1)}"/>` : '';
  const path = n > 0 ? `<path class="line" d="${xs.map((xx, i) => (i ? 'L' : 'M') + xx.toFixed(1) + ',' + ys[i].toFixed(1)).join('')}"/>` : '';

  const dots = pts.map((p, i) => {
    const warn = o.warnAbove != null && p.v > o.warnAbove;
    if (pts.length > 10 && i !== n && !warn) return '';
    return `<circle class="dot${warn ? ' warn' : ''}" cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="4"/>`;
  }).join('');
  const ly = ys[n] - 10 < 10 ? ys[n] + 20 : ys[n] - 10;
  const endLabel = `<text class="end-label" x="${xs[n].toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${n > 0 ? 'end' : 'middle'}">${esc(pts[n].label)}</text>`;
  const xl = n > 0
    ? `<text class="tick" x="${L}" y="${H - 6}">${shortDate(t0)}</text><text class="tick" x="${W - R}" y="${H - 6}" text-anchor="end">${shortDate(t1)}</text>`
    : `<text class="tick" x="${xs[0].toFixed(1)}" y="${H - 6}" text-anchor="middle">${shortDate(t0)}</text>`;

  return `<div class="chart" data-chart="${esc(id)}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${grid}${ref}${path}${dots}${endLabel}${xl}
      <g class="xh" style="display:none"><line class="xh-line" x1="0" x2="0" y1="${T}" y2="${H - B}"/><circle class="xh-dot" r="6"/></g>

      <button type="button" class="dl-btn" data-csv>${STANDALONE ? 'Save a copy' : 'Download a copy'} (CSV)</button>
      <label class="dl-btn ghost" for="csv-in">Load a copy</label>
      <input type="file" id="csv-in" accept=".csv,text/csv,text/plain" hidden>
    </div></div>`;
}
function csvCell(v) { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function buildCSV() {
  const unit = S.prefs.unit, out = [];
  for (const s of finishedList()) {
    const date = dayKey(new Date(s.startedAt)), time = fmtTime(s.startedAt), day = DAY[s.day] ? DAY[s.day].name : s.day;
    let k = 0;
    for (const id of sessionIds(s)) {
      const ex = EX[id], hold = ex && ex.kind === 'hold';
      let n = 0;
      for (const r of doneRows(s, id)) {
        out.push({ at: s.startedAt + k++, cells: [date, time, day, ex ? ex.name : id, r.k === 'ramp' ? 'ramp-up' : ++n, r.w, hold ? '' : r.r, hold ? r.r : '', '',
          s.id, new Date(s.startedAt).toISOString(), new Date(s.finishedAt || s.startedAt).toISOString()] });
      }
    }
  }
  for (const key of Object.keys(S.knee.checks)) {
    const c = S.knee.checks[key];
    if (c && typeof c.p === 'number') out.push({ at: keyDate(key).getTime(), cells: [key, '', '', 'Morning knee check', '', '', '', '', c.p, '', '', ''] });
  }
  out.sort((a, b) => a.at - b.at);
  const head = ['date', 'time', 'day', 'exercise', 'set', 'weight (' + unit + ')', 'reps', 'seconds', 'knee pain (0-10)', 'workout id', 'started', 'finished'];
  return [head].concat(out.map((o) => o.cells)).map((l) => l.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

/* Load a copy: reads a CSV made by "Download/Save a copy" (from either version) and adds anything new. */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function parseLocalTime(date, time) {
  const [y, m, d] = String(date).split('-').map(Number);
  let hh = 12, mm = 0;
  const t = /(\d{1,2}):(\d{2})\s*([AaPp])?/.exec(time || '');
  if (t) { hh = +t[1]; mm = +t[2]; if (t[3]) { const pm = /p/i.test(t[3]); hh = hh === 12 ? (pm ? 12 : 0) : pm ? hh + 12 : hh; } }
  return new Date(y, m - 1, d, hh, mm).getTime();
}
function importCSV(text) {
  const rows = parseCSV(text.replace(/^﻿/, ''));
  const head = (rows.shift() || []).map((h) => h.trim().toLowerCase());
  const col = (name) => head.findIndex((h) => h.startsWith(name));
  const c = { date: col('date'), time: col('time'), day: col('day'), ex: col('exercise'), set: col('set'), w: col('weight'), reps: col('reps'), sec: col('seconds'), knee: col('knee'), id: col('workout id'), st: col('started'), fin: col('finished') };
  if (c.date < 0 || c.ex < 0) return null;
  const exByName = {}; Object.keys(EX).forEach((id) => { exByName[EX[id].name.toLowerCase()] = id; });
  const dayByName = {}; DAYS.forEach((d) => { dayByName[d.name.toLowerCase()] = d.id; });
  const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
  const found = {}; let knee = 0;
  for (const r of rows) {
    if (!r.length || r.every((x) => !x)) continue;
    const name = (r[c.ex] || '').trim().toLowerCase(), date = (r[c.date] || '').trim();
    if (name === 'morning knee check') {
      const p = parseInt(r[c.knee], 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(date) && p >= 0 && p <= 10 && !S.knee.checks[date]) { S.knee.checks[date] = { p, at: now() }; knee++; }
      continue;
    }
    const exId = exByName[name], dayId = dayByName[(r[c.day] || '').trim().toLowerCase()];
    if (!exId || !dayId || !/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
    const started = (c.st >= 0 && Date.parse(r[c.st])) || parseLocalTime(date, c.time >= 0 ? r[c.time] : '');
    const sid = (c.id >= 0 && /^[A-Za-z0-9_-]+$/.test(r[c.id] || '') && r[c.id]) || 'i' + dayId + started.toString(36);
    const fin = (c.fin >= 0 && Date.parse(r[c.fin])) || started;
    const s = found[sid] || (found[sid] = { id: sid, day: dayId, startedAt: started, finishedAt: fin, updatedAt: now(), log: {} });
    const hold = EX[exId].kind === 'hold', ramp = (r[c.set] || '').trim().toLowerCase() === 'ramp-up';
    const row = { w: num(r[c.w]), r: num(hold ? r[c.sec] : r[c.reps]), done: true };
    if (ramp) row.k = 'ramp';
    (s.log[exId] = s.log[exId] || [])[ramp ? 'unshift' : 'push'](row);
  }
  let added = 0;
  for (const s of Object.values(found)) {
    const have = S.sessions[s.id];
    if (have && !have.deleted) continue;
    S.sessions[s.id] = s; added++;
    queueRemote(s.id);
  }
  if (knee) { S.knee.updatedAt = now(); queueRemote('knee'); }
  if (added || knee) { ver++; saveLocal(); }
  return { added, knee };
}
function loadCSVFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const res = importCSV(String(fr.result || ''));
    if (!res) { toast('That file isn’t a Four-Day Split copy. Pick a CSV made with the Save or Download a copy button.'); return; }
    if (!res.added && !res.knee) { toast('Nothing new in that file. Everything in it is already in your log.'); return; }
    const parts = [];
    if (res.added) parts.push(`${res.added} workout${res.added === 1 ? '' : 's'}`);
    if (res.knee) parts.push(`${res.knee} knee check${res.knee === 1 ? '' : 's'}`);
    toast(`Loaded ${parts.join(' and ')}.`);
    renderHistory();
    if (T.mode !== 'prep' && T.mode !== 'hold') renderWorkout();
  };
  fr.onerror = () => toast('That file couldn’t be read. Try picking it again.');
  fr.readAsText(file);
}
/* In the phone copy, hand the file to the share sheet (Save to Files); fall back to a plain download. */
function saveFileOnDevice(filename, text) {
  const file = new File([text], filename, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: filename }).catch((e) => { if (!e || e.name !== 'AbortError') toast('The file didn’t save this time. Try again.'); });
    return;
  }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function downloadCSV() {
  const name = 'four-day-split-log-' + dayKey(new Date()) + '.csv';
  if (STANDALONE) { saveFileOnDevice(name, buildCSV()); return; }
  const csv = buildCSV(), c = window.claude;
  let dl = null;
  try { dl = c && typeof c.use === 'function' ? await c.use('downloads') : null; } catch (e) {}
  if (!dl) { toast('Saving files isn’t available here. Open this page in Claude to download a copy.'); return; }
  try {
    await dl.save({ filename: name, data: csv });
    toast('Saved a copy of your log as a CSV file.');
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') return;
    toast(code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'The file didn’t save this time. Try again in a moment.');
  }
}

/* ---------- Settings ---------- */
function sw(key, label, help) {
  return `<div class="setting"><div class="s-text"><p class="s-label" id="lbl-${key}">${label}</p><p class="s-help" id="help-${key}">${help}</p></div>
    <button type="button" class="switch" role="switch" id="sw-${key}" data-pref="${key}" aria-checked="${!!S.prefs[key]}" aria-labelledby="lbl-${key}"><span></span></button></div>`;
}
function renderSettings() {
  const p = S.prefs;
  $('#view-settings').innerHTML = `<h2 class="view-title">Settings</h2><p class="view-sub">Saved for next time.</p>
    <div class="set-group">
      <div class="setting"><div class="s-text"><p class="s-label">Weight unit</p><p class="s-help">Changes the column labels. Logged numbers stay as you typed them.</p></div>
        <div class="seg" role="group" aria-label="Weight unit">${['lb', 'kg'].map((u) => `<button type="button" class="chip" data-unit="${u}" aria-pressed="${p.unit === u}">${u}</button>`).join('')}</div></div>
      <div class="setting col"><div class="s-text"><p class="s-label">Rest when the plan doesn’t give one</p><p class="s-help">Used for the Upper A pairs and the farmer hold. Every other block uses the rest from your plan.</p></div>
        <div class="chips" role="group" aria-label="Rest length">${[30, 45, 60, 75, 90, 120].map((v) => `<button type="button" class="chip" data-rest="${v}" aria-pressed="${p.rest === v}">${fmtRest(v)}</button>`).join('')}</div></div>
      ${sw('autoRest', 'Start rest automatically', 'After each set, or after each round in a pair or circuit.')}
      ${sw('sound', 'Beep and vibrate', 'When a rest or a timed hold ends. Phones on silent may stay quiet.')}
      ${sw('wake', 'Keep the screen on', wakeText())}
    </div>
    <div class="set-group pad"><p class="s-label">Where your log is saved</p><p class="s-help" data-sync>${syncText()}</p></div>
    <div class="set-group pad how"><p class="s-label">How it works</p><ul>
      <li>Grey numbers are the plan’s target reps or seconds, and your previous weight today or last time. Tap the check on an empty set to log them as they are.</li>
      <li>Pairs and circuits go round by round: one set of each exercise, then rest. The rest timer starts when you finish a round.</li>
      <li>Timed holds have a stopwatch button. After a 5-second get-set it counts down from the seconds in that set.</li>
      <li>R is a ramp-up set. It’s logged but isn’t used for your working-set numbers.</li>
      <li>Finish workout logs the day and moves you to the next one in the rotation.</li>
    </ul></div>`;
}
function setPref(k, v) {
  S.prefs[k] = v; S.prefs.updatedAt = now();
  saveLocal(); queueRemote('prefs');
  renderSettings();
  if (k === 'wake') { if (v) requestWake(); else releaseWake(); }
  if (k === 'unit') renderList();
  if (T.mode === 'idle') renderDock();
}

/* ---------- Events ---------- */
function setTab(tab) {
  ui.tab = tab;
  for (const t of ['workout', 'history', 'settings']) {
    $('#view-' + t).hidden = t !== tab;
    $('#tab-' + t).setAttribute('aria-selected', String(t === tab));
  }
  if (tab === 'history') renderHistory();
  if (tab === 'settings') renderSettings();
  window.scrollTo(0, 0);
}
document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
$('#plates').addEventListener('click', (e) => { const b = e.target.closest('[data-pick]'); if (b && b.dataset.pick !== cur.day) { ui.pickedDay = true; selectDay(b.dataset.pick); } });

const knee = $('#knee');
knee.addEventListener('click', (e) => {
  const p = e.target.closest('[data-pain]');
  if (p) {
    S.knee.checks[dayKey(new Date())] = { p: +p.dataset.pain, at: now() };
    S.knee.updatedAt = now();
    saveLocal(); queueRemote('knee');
    ui.kneeEdit = false; renderKnee();
    return;
  }
  const k = e.target.closest('[data-knee]');
  if (k) { ui.kneeEdit = k.dataset.knee === 'edit'; renderKnee(); }
});
knee.addEventListener('toggle', (e) => { if (e.target.classList && e.target.classList.contains('rules')) ui.rulesOpen = e.target.open; }, true);

const exlist = $('#exlist');
exlist.addEventListener('input', (e) => {
  const inp = e.target.closest('.in'); if (!inp) return;
  const row = inp.closest('.set-row'), exId = row.dataset.ex, i = +row.dataset.i, f = inp.dataset.f;
  const rows = cur.s.log[exId]; if (!rows || !rows[i]) return;
  rows[i][f] = parseVal(inp.value, f);
  commit();
  refreshPlaceholders(exId);
});
exlist.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('in')) e.target.blur(); });
exlist.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const b = BLOCK[btn.closest('.block').dataset.block];
  const row = btn.closest('.set-row');
  switch (btn.dataset.act) {
    case 'check': toggleSet(row.dataset.ex, +row.dataset.i); break;
    case 'hold': toggleHold(row.dataset.ex, +row.dataset.i); break;
    case 'add': changeSets(b, +btn.dataset.g, true); break;
    case 'remove': changeSets(b, +btn.dataset.g, false); break;
    case 'expand': ui.expanded.add(b.id); rerenderBlock(b.id); break;
    case 'xround': ui.expanded.add(btn.closest('.round').dataset.rk); rerenderBlock(b.id); break;
    case 'swap': doSwap(b, btn.dataset.base); break;
  }
});

$('#finish').addEventListener('click', (e) => {
  if (e.target.closest('#finish-btn')) {
    const { dn, tot } = counts(cur.s);
    if (!dn) return;
    if (dn < tot && !confirmTap('finish')) { renderFinish(); return; }
    ui.confirm = null;
    const s = cur.s;
    s.finishedAt = now();
    commit(s);
    if (T.s === s && (T.mode === 'prep' || T.mode === 'hold')) T = { mode: 'idle' };
    const nx = DAY[nextDay()];
    toast(`${DAY[s.day].name} logged: ${dn} sets in ${fmtDur(s.finishedAt - s.startedAt)}. Next up is ${nx.name}.`);
    selectDay(nx.id);
    window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
  } else if (e.target.closest('#discard-btn')) {
    if (!confirmTap('discard')) { renderFinish(); return; }
    const s = cur.s;
    if (T.s === s) T = { mode: 'idle' };
    s.deleted = true; s.log = {};
    commit(s);
    toast('Workout discarded.');
    selectDay(cur.day);
  }
});

$('#dock').addEventListener('click', (e) => {
  const b = e.target.closest('[data-dock]'); if (!b) return;
  unlockAudio();
  switch (b.dataset.dock) {
    case 'rest': { const nx = nextOpen(); startRest(restFor(nx && nx.b), nx && nx.b); break; }
    case 'minus': T.end -= 15000; tick(); break;
    case 'plus': T.end += 15000; T.total = Math.max(T.total, T.end - now()); tick(); break;
    case 'skip': case 'ok': T = { mode: 'idle' }; renderDock(); break;
    case 'cancel': cancelTimer(); break;
    case 'stop': stopHold(); break;
  }
});

const viewHistory = $('#view-history');
viewHistory.addEventListener('pointermove', chartPoint);
viewHistory.addEventListener('pointerdown', chartPoint);
viewHistory.addEventListener('pointerout', chartOut);
viewHistory.addEventListener('change', (e) => {
  if (e.target.id !== 'csv-in') return;
  loadCSVFile(e.target.files && e.target.files[0]);
  e.target.value = '';
});
viewHistory.addEventListener('click', (e) => {
  const hv = e.target.closest('[data-hview]');
  if (hv) { ui.hview = hv.dataset.hview; renderHistory(); return; }
  const pg = e.target.closest('[data-prog]');
  if (pg) { const id = pg.dataset.prog; if (ui.progOpen.has(id)) ui.progOpen.delete(id); else ui.progOpen.add(id); renderHistory(); return; }
  if (e.target.closest('[data-csv]')) { downloadCSV(); return; }
  const h = e.target.closest('[data-hist]');
  if (h) { const id = h.dataset.hist; if (ui.histOpen.has(id)) ui.histOpen.delete(id); else ui.histOpen.add(id); renderHistory(); return; }
  const d = e.target.closest('[data-del]');
  if (d) {
    const id = d.dataset.del;
    if (!confirmTap('del:' + id)) { renderHistory(); return; }
    const s = S.sessions[id];
    if (s) { s.deleted = true; s.log = {}; commit(s); }
    ui.histOpen.delete(id);
    renderHistory();
    if (T.mode !== 'prep' && T.mode !== 'hold') renderWorkout();
    toast('Workout deleted.');
  }
});

$('#view-settings').addEventListener('click', (e) => {
  const u = e.target.closest('[data-unit]'); if (u) { setPref('unit', u.dataset.unit); return; }
  const r = e.target.closest('[data-rest]'); if (r) { setPref('rest', +r.dataset.rest); return; }
  const p = e.target.closest('[data-pref]'); if (p) setPref(p.dataset.pref, !S.prefs[p.dataset.pref]);
});

document.addEventListener('pointerdown', () => { unlockAudio(); requestWake(); }, { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWake(); if (T.mode !== 'idle') tick(); updateHeroMeta(); renderKnee();
    if (sync.col && (!sync.unsub || sync.mode === 'error' || sync.mode === 'offline')) subscribe();
    if (sync.col) flushPending();
  }
  else { flushAll(); writeLocal(); }
});
window.addEventListener('pagehide', () => { flushAll(); writeLocal(); });
setInterval(updateHeroMeta, 30000);

/* ---------- Start ---------- */
loadLocal();
tidy();
selectDay(startDay());
if (STANDALONE) setSync('local');
else initRemote();
})();
</script>

if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
